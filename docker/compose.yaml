# BMAC stack: a single application container (Caddy, php-fpm, queue worker
# and scheduler under supervisord) plus optional backing services.
#
#   cd docker && cp .env.example .env   # then edit .env
#   docker compose up -d
#
# MariaDB, Redis and Mailpit are behind compose profiles (db, redis, mail) and
# are enabled through COMPOSE_PROFILES in .env. Remove a profile to use an
# external service instead and point DB_* / REDIS_* / MAIL_* at it.
# Each backing service can also be started on its own, e.g.
#   docker compose up -d mariadb

name: ${COMPOSE_PROJECT_NAME:-bmac}

services:
  # Caddy + php-fpm + queue worker + scheduler, supervised by supervisord.
  app:
    image: ${BMAC_IMAGE:-bmac:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BOOTSTRAP_COLOR_PRIMARY: ${BOOTSTRAP_COLOR_PRIMARY:-#2C3E50}
        BOOTSTRAP_COLOR_SECONDARY: ${BOOTSTRAP_COLOR_SECONDARY:-#95a5a6}
        BOOTSTRAP_COLOR_TERTIARY: ${BOOTSTRAP_COLOR_TERTIARY:-#18BC9C}
        BOOTSTRAP_COLOR_SUCCESS: ${BOOTSTRAP_COLOR_SUCCESS:-#18BC9C}
        BOOTSTRAP_COLOR_DANGER: ${BOOTSTRAP_COLOR_DANGER:-#E74C3C}
        BOOTSTRAP_COLOR_WARNING: ${BOOTSTRAP_COLOR_WARNING:-#F39C12}
    env_file: .env
    restart: unless-stopped
    # Leave time for running queue jobs to finish (QUEUE_STOP_WAIT).
    stop_grace_period: 90s
    ports:
      - "${APP_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - storage:/var/www/html/storage
    networks:
      - bmac
    depends_on:
      mariadb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      mailpit:
        condition: service_started
        required: false

  mariadb:
    image: mariadb:11.8
    profiles: [db]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-bmac}
      MARIADB_USER: ${DB_USERNAME:-bmac}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_BIND:-127.0.0.1:3306}:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - bmac
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis:
    image: redis:8-alpine
    profiles: [redis]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    volumes:
      - redis:/data
    networks:
      - bmac
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_BIND:-127.0.0.1:1025}:1025"
      - "${MAILPIT_UI_BIND:-127.0.0.1:8025}:8025"
    networks:
      - bmac

networks:
  bmac:

volumes:
  storage:
  mariadb:
  redis:
