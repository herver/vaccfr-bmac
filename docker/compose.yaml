# BMAC stack: a single application container (Caddy, php-fpm, queue worker
# and scheduler under supervisord) plus optional backing services.
#
#   cd docker && cp .env.example .env   # then edit .env
#   docker compose up -d
#
# PostgreSQL, Redis and Mailpit are behind compose profiles (db, redis, mail) and
# are enabled through COMPOSE_PROFILES in .env. Remove a profile to use an
# external service instead and point DB_* / REDIS_* / MAIL_* at it.
# Each backing service can also be started on its own, e.g.
#   docker compose up -d postgres

name: ${COMPOSE_PROJECT_NAME:-bmac}

services:
  # Caddy + php-fpm + queue worker + scheduler, supervised by supervisord.
  app:
    image: ${BMAC_IMAGE:-bmac:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BOOTSTRAP_COLOR_PRIMARY: ${BOOTSTRAP_COLOR_PRIMARY:-#2C3E50}
        BOOTSTRAP_COLOR_SECONDARY: ${BOOTSTRAP_COLOR_SECONDARY:-#95a5a6}
        BOOTSTRAP_COLOR_TERTIARY: ${BOOTSTRAP_COLOR_TERTIARY:-#18BC9C}
        BOOTSTRAP_COLOR_SUCCESS: ${BOOTSTRAP_COLOR_SUCCESS:-#18BC9C}
        BOOTSTRAP_COLOR_DANGER: ${BOOTSTRAP_COLOR_DANGER:-#E74C3C}
        BOOTSTRAP_COLOR_WARNING: ${BOOTSTRAP_COLOR_WARNING:-#F39C12}
    env_file: .env
    restart: unless-stopped
    # Leave time for running queue jobs to finish (QUEUE_STOP_WAIT).
    stop_grace_period: 90s
    ports:
      - "${APP_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - storage:/var/www/html/storage
    networks:
      - bmac
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      mailpit:
        condition: service_started
        required: false

  postgres:
    # Major version upgrades need a dump/restore (or pg_upgrade), do not just
    # bump the tag on an existing volume.
    image: postgres:18-alpine
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bmac}
      POSTGRES_USER: ${DB_USERNAME:-bmac}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_BIND:-127.0.0.1:5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep their data in a versioned subdirectory.
      - postgres:/var/lib/postgresql
    networks:
      - bmac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis:
    image: redis:8-alpine
    profiles: [redis]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    volumes:
      - redis:/data
    networks:
      - bmac
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_BIND:-127.0.0.1:1025}:1025"
      - "${MAILPIT_UI_BIND:-127.0.0.1:8025}:8025"
    networks:
      - bmac

networks:
  bmac:

volumes:
  storage:
  postgres:
  redis:
