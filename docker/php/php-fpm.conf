; Replaces the upstream zz-docker.conf: bind to loopback only, Caddy is the
; sole client of php-fpm inside the container.
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000

; Keep the container environment (DB_*, REDIS_*, ...) visible to workers.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Access logs are handled by Caddy.
access.log = /dev/null

pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
