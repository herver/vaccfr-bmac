; Process supervisor for the BMAC container: web server, php-fpm, queue
; worker and scheduler all run in one container. supervisord runs as the
; unprivileged www-data user and forwards every program's output to the
; container logs.

[supervisord]
nodaemon = true
user = www-data
logfile = /dev/null
logfile_maxbytes = 0
loglevel = %(ENV_SUPERVISOR_LOG_LEVEL)s
pidfile = /tmp/supervisord.pid
childlogdir = /tmp

[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
priority = 10
autorestart = true
stopsignal = QUIT
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:caddy]
command = caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
priority = 20
autorestart = true
stopsignal = TERM
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue]
; Horizon when QUEUE_CONNECTION=redis, queue:work otherwise (see bmac-queue).
command = bmac-queue
priority = 30
autostart = %(ENV_QUEUE_ENABLED)s
autorestart = true
startsecs = 5
stopsignal = TERM
; Let running jobs finish before being killed.
stopwaitsecs = %(ENV_QUEUE_STOP_WAIT)s
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = php artisan schedule:work
priority = 40
autostart = %(ENV_SCHEDULER_ENABLED)s
autorestart = true
startsecs = 5
stopsignal = TERM
stopwaitsecs = 60
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Stop the whole container when a program keeps crashing (FATAL), so Docker's
; restart policy can take over instead of leaving a half-working container.
[eventlistener:watchdog]
command = supervisor-watchdog
events = PROCESS_STATE_FATAL
priority = 1
autorestart = true
stdout_logfile = NONE
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
